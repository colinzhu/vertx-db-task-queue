<html lang="html">

<head>
    <title>Task Queue Support</title>
    <link rel="stylesheet" href="lib/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link href="lib/tabulator_bootstrap4.min.css" rel="stylesheet">
    <script type="text/javascript" src="lib/tabulator.min.js"></script>
    <script type="module" src="main.js"></script>
    <style>
        body {
            margin: 0;
            font-family: arial, sans-serif;
        }

        nav {
            margin-bottom: 10px;
        }

        button {
            margin: 10px 10px;
        }

        .tabulator {
            margin: 10px 10px 30px 10px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <span class="navbar-brand mb-0 h1">Task Queue Support</span>
    </nav>

    <button id="btn-refresh" type="button" class="btn btn-primary">refresh</button>
    <div id="table-count"></div>

    <button id="btn-reenqueue-selected" type="button" class="btn btn-danger">reenqueue</button>
    <button id="btn-markpoison-selected" type="button" class="btn btn-secondary">mark as poison</button>
    <button id="btn-poisontoerror-selected" type="button" class="btn btn-secondary">poison to error</button>
    <button id="btn-housekeeppoison-selected" type="button" class="btn btn-warning">housekeep poison</button>

    <span id="select-stats"></span>
    <span id="custom-page-count"></span>
    <span id="custom-pagination" class="tabulator-paginator"></span>
    <div id="table-list"></div>
</body>

</html>
